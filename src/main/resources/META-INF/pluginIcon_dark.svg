    <!-- Required / Essential Pin / Star Accent on bottom right -->
    <circle cx="53" cy="53" r="11" fill="#FFC72C"/>
    <path d="M53 46.5L54.8 50.2L58.9 50.8L55.9 53.7L56.6 57.8L53 55.9L49.4 57.8L50.1 53.7L47.1 50.8L51.2 50.2L53 46.5Z" fill="#1D2024"/>
    
